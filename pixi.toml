[workspace]
authors = ["jwang771 <jwanggpt@gmail.com>"]
channels = ["nvidia", "conda-forge"]
name = "3dws"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.10.*"
cuda-toolkit = "12.8.*"
pip = "*"
setuptools = "<82"

[pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu128" }
numpy = "==2.2.6"
h5py = "==3.16.0"
opencv-python-headless = "==5.0.0.93"
einops = "==0.8.2"
lpips = "==0.1.4"
gsplat = "==1.5.3"
scipy = "==1.15.3"
spconv-cu126 = "==2.3.8"
